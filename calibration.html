<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calibration | Capitol Forecast</title>
  <meta name="description" content="Forecast calibration and backtest diagnostics.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#fffdf8">
  <link rel="stylesheet" href="assets/wiki.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="assets/img/spd_logo.jpg" alt="Capitol Forecast">
      <span><strong>Capitol Forecast</strong><small>Election forecasts</small></span>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="senate.html">Senate</a>
      <a href="house.html">House</a>
      <a href="president.html">2028 Pres</a>
      <a class="active" href="calibration.html">Calibration</a>
      <a href="articles.html">Articles</a>
    </nav>
  </header>

  <main>
    <section class="text-panel image-panel compact-page-head">
      <p class="kicker">Calibration</p>
      <h1>Backtest diagnostics.</h1>
    </section>

    <section class="dashboard-grid" aria-label="Calibration summaries">
      <article class="chart-panel chart-wide">
        <span class="chart-label">Senate probability buckets</span>
        <div id="calibration-buckets" class="calibration-table"></div>
      </article>
      <article class="chart-panel chart-wide">
        <span class="chart-label">Historical backtest status</span>
        <div id="historical-backtest-status" class="backtest-status"></div>
      </article>
      <article class="chart-panel chart-wide">
        <span class="chart-label">Margin error by race type</span>
        <div id="calibration-breakdowns" class="calibration-table"></div>
      </article>
      <article class="chart-panel">
        <span class="chart-label">Model error</span>
        <dl class="race-stats">
          <div><dt>Historical sample</dt><dd id="calibration-sample">--</dd></div>
          <div><dt>Mean Brier score</dt><dd id="calibration-brier">--</dd></div>
          <div><dt>Mean margin miss</dt><dd id="calibration-margin-error">--</dd></div>
        </dl>
      </article>
      <article class="chart-panel">
        <span class="chart-label">Largest margin misses</span>
        <div id="calibration-worst" class="leverage-chart"></div>
      </article>
    </section>
  </main>

  <script src="assets/wiki.js"></script>
</body>
</html>
